const FLOORS = [1, 2, 3];
const savedFloor = (() => { try { return Number(localStorage.getItem('floor')); } catch (e) { return 0; } })();
const S = { 
  session: null, role: 'viewer', page: 'dashboard', areas: [], plan: null, viewPlan: null, 
  url: null, size: null, loading: true, sel: new URLSearchParams(location.search).get('area'),
  labels: true, z: 1, pan: {x: 0, y: 0}, q: '', dq: '', db: '', dd: '', sort: 'area_name', 
  asc: true, pg: 0, editId: null, form: {}, plans: [],
  floor: FLOORS.includes(savedFloor) ? savedFloor : 1,  // floor shown on viewer pages
  mFloor: null,                                          // floor chosen in Manage Areas
  ctx: null, tok: 0
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f2 = n => Number(n).toFixed(2);
const INP = 'w-full rounded-md border border-slate-300 bg-white px-2.5 py-1.5 text-sm focus:outline focus:outline-2 focus:outline-blue-500';
const BTN = 'rounded-md px-3 py-1.5 text-sm font-medium disabled:opacity-50 ';
const PRI = BTN + 'bg-blue-600 text-white hover:bg-blue-700', GHO = BTN + 'border border-slate-300 bg-white hover:bg-slate-50';
const isAdmin = () => S.role === 'admin';
const selArea = () => S.areas.find(a => a.id === S.sel);
const curFloor = () => S.page === 'manage' ? S.mFloor : S.floor;
const want = () => S.viewPlan && isAdmin() ? 'p' + S.viewPlan : 'f' + curFloor();
let RO = null, urlTimer = null;

function toast(m){ 
  const t = document.createElement('div'); 
  t.setAttribute('role','status'); 
  t.className = 'fixed bottom-4 right-4 z-50 rounded-md bg-slate-900 px-4 py-2 text-sm text-white shadow-lg'; 
  t.textContent = m; 
  document.body.append(t); 
  setTimeout(() => t.remove(), 3500); 
}

function select(id){ 
  S.sel = id; 
  const u = new URL(location.href); 
  id ? u.searchParams.set('area', id) : u.searchParams.delete('area'); 
  history.replaceState(null, '', u); 
  render(); 
}

/* ---------- floor plan image URL: keep it fresh so it never expires on screen ---------- */
async function refreshUrl(){
  if (!S.plan) return null;
  const { data } = await sb.storage.from('floor-plans').createSignedUrl(S.plan.storage_path, 3600);
  if (data?.signedUrl) S.url = data.signedUrl;
  return data?.signedUrl || null;
}
async function swapImg(){
  const u = await refreshUrl(), i = $('pimg');
  if (!u || !i) return;
  const n = new Image(); n.onload = () => { i.src = u; }; n.src = u;
}
function keepUrlFresh(){ clearInterval(urlTimer); urlTimer = setInterval(swapImg, 40 * 60 * 1000); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.session && S.plan) swapImg(); });

async function load(){
  const tok = ++S.tok;
  S.loading = true; S.ctx = want(); render();
  const rev = S.viewPlan && isAdmin(), fl = curFloor();
  let p = null;
  if (rev) ({ data: p } = await sb.from('floor_plans').select('*').eq('id', S.viewPlan).maybeSingle());
  else if (fl) ({ data: p } = await sb.from('floor_plans').select('*').eq('floor', fl).eq('is_active', true).maybeSingle());
  if (tok !== S.tok) return;
  S.plan = p; S.size = p?.image_width && p?.image_height ? {w: p.image_width, h: p.image_height} : null;
  if (p) {
    const [a, s] = await Promise.all([ sb.from('areas').select('*').eq('floor_plan_id', p.id).order('area_code'), sb.storage.from('floor-plans').createSignedUrl(p.storage_path, 3600) ]);
    if (tok !== S.tok) return;
    S.areas = a.data || []; S.url = s.data?.signedUrl || null; if (S.sel && !S.areas.some(x => x.id === S.sel)) S.sel = null;
  } else { S.areas = []; S.url = null; S.sel = null; }
  keepUrlFresh();
  S.loading = false; render();
}

async function init(){
  const { data } = await sb.auth.getSession(); S.session = data.session;
  // do not call Supabase inside this callback directly (can deadlock) -> defer
  sb.auth.onAuthStateChange((_e, s) => { const was = !!S.session; S.session = s; if (!!s !== was) setTimeout(start, 0); });
  start();
}

async function start(){
  if (!S.session) { S.ctx = null; return render(); }
  const { data } = await sb.from('profiles').select('role').eq('id', S.session.user.id).maybeSingle(); 
  S.role = data?.role || 'viewer';
  load();
}

/* ---------- floor tabs (viewer pages) ---------- */
function floorTabs(){
  return '<div class="flex flex-wrap items-center gap-2" role="tablist" aria-label="Select floor">' + FLOORS.map(n =>
    '<button role="tab" aria-selected="' + (S.floor === n) + '" data-floor="' + n + '" class="rounded-md px-3 py-1.5 text-sm font-medium ' + (S.floor === n ? 'bg-blue-600 text-white' : 'border border-slate-300 bg-white hover:bg-slate-50') + '">Floor ' + n + '</button>').join('') + '</div>';
}

function bindFloorTabs(){
  document.querySelectorAll('[data-floor]').forEach(b => b.onclick = () => {
    const n = Number(b.dataset.floor); if (n === S.floor) return;
    S.floor = n; try { localStorage.setItem('floor', n); } catch (e) {}
    S.sel = null; S.q = ''; S.dq = ''; S.db = ''; S.dd = ''; S.pg = 0; S.z = 1; S.pan = {x: 0, y: 0};
    const u = new URL(location.href); u.searchParams.delete('area'); history.replaceState(null, '', u);
    load();
  });
}

function planHTML(draw){
  const W = S.size?.w || 1000, H = S.size?.h || 700;
  const gs = S.areas.filter(a => !(draw && a.id === S.editId)).map(a => {
    const x = a.x * W, y = a.y * H, w = a.w * W, h = a.h * H, sel = a.id === S.sel, fs = Math.min(h * .4, w / Math.max(a.area_code.length, 1) * 1.6);
    return '<g data-id="' + a.id + '" tabindex="0" role="button" aria-label="' + esc(a.area_code + ' ' + a.area_name) + '" class="area cursor-pointer" style="outline:none">' +
      '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + (sel ? 'rgba(37,99,235,.22)' : 'rgba(15,23,42,.02)') + '" stroke="' + (sel ? '#2563eb' : '#475569') + '" stroke-width="' + (sel ? 3 : 1.5) + '" vector-effect="non-scaling-stroke"/>' +
      (S.labels && fs >= 6 ? '<text x="' + (x + w/2) + '" y="' + (y + h/2) + '" text-anchor="middle" dominant-baseline="central" font-size="' + fs + '" font-weight="600" fill="' + (sel ? '#1d4ed8' : '#0f172a') + '" stroke="#fff" stroke-width="' + (fs/6) + '" paint-order="stroke" pointer-events="none">' + esc(a.area_code) + '</text>' : '') + '</g>'; 
  }).join('');
  return '<div id="pv" class="relative h-full min-h-[380px] overflow-hidden rounded-xl border border-slate-200 bg-slate-100" style="touch-action:none;cursor:' + (draw ? 'crosshair' : 'grab') + '">' +
    '<div class="absolute right-3 top-3 z-10 flex flex-col gap-1"><button data-z="in" aria-label="Zoom in" class="' + GHO + '">＋</button><button data-z="out" aria-label="Zoom out" class="' + GHO + '">－</button><button data-z="reset" aria-label="Reset view" class="' + GHO + '">⟲</button></div>' +
    (!S.plan && !S.loading ? '<p class="absolute inset-0 grid place-items-center p-6 text-center text-sm text-slate-500">No active floor plan for Floor ' + esc(curFloor() ?? '') + '. Administrators can upload and activate one in Settings.</p>' : '') +
    '<div id="pload" class="absolute inset-0 animate-pulse bg-slate-200 ' + (S.url ? '' : 'hidden') + '"></div><p id="perr" class="absolute inset-0 hidden place-items-center p-6 text-center text-sm text-red-600">Failed to load floor plan image.</p>' +
    '<div class="grid h-full w-full place-items-center"><div id="pbox" class="relative" style="width:100%;aspect-ratio:' + W + '/' + H + '">' +
    (S.url ? '<img id="pimg" src="' + esc(S.url) + '" alt="Facility floor plan" draggable="false" class="absolute inset-0 h-full w-full select-none">' : '') +
    '<svg id="psvg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" class="absolute inset-0 h-full w-full">' + gs + '<rect id="draft" class="hidden" fill="rgba(20,184,166,.25)" stroke="#0d9488" stroke-width="2" stroke-dasharray="8 4" vector-effect="non-scaling-stroke" pointer-events="none"/></svg></div></div>' +
    '<div id="ptip" class="pointer-events-none absolute bottom-3 left-3 hidden rounded-md bg-slate-900/90 px-2.5 py-1 text-xs text-white"></div></div>';
}

function fit(){ 
  const pv = $('pv'), box = $('pbox'); if(!pv || !box) return; 
  const W = S.size?.w || 1000, H = S.size?.h || 700, s = Math.min(pv.clientWidth / W, pv.clientHeight / H);
  box.style.width = W * s + 'px'; box.style.height = H * s + 'px'; box.style.transform = 'translate(' + S.pan.x + 'px,' + S.pan.y + 'px) scale(' + S.z + ')'; 
}

function drawDraft(r){ 
  const d = $('draft'); if(!d) return; 
  const W = S.size?.w || 1000, H = S.size?.h || 700;
  if(!r){ d.classList.add('hidden'); return; } 
  d.classList.remove('hidden'); d.setAttribute('x', r.x * W); d.setAttribute('y', r.y * H); d.setAttribute('width', r.w * W); d.setAttribute('height', r.h * H); 
}

function bindPlan(draw){
  const pv = $('pv'); if(!pv) return; fit();
  RO?.disconnect(); RO = new ResizeObserver(fit); RO.observe(pv);
  const img = $('pimg'); 
  if(img){ 
    img.onload = () => { $('pload').classList.add('hidden'); if(!S.size){ S.size = {w: img.naturalWidth, h: img.naturalHeight}; render(); } }; 
    img.onerror = async () => {
      if(!img.dataset.retried){ img.dataset.retried = '1'; const u = await refreshUrl(); if(u){ img.src = u; return; } }
      $('pload').classList.add('hidden'); $('perr').classList.remove('hidden'); $('perr').classList.add('grid'); 
    }; 
  }
  pv.querySelectorAll('[data-z]').forEach(b => {
    b.onpointerdown = e => e.stopPropagation();   // otherwise pointer capture on #pv swallows the click
    b.onclick = e => { 
      e.stopPropagation(); const k = b.dataset.z; 
      if(k === 'reset'){ S.z = 1; S.pan = {x: 0, y: 0}; } 
      else S.z = Math.min(6, Math.max(.5, S.z * (k === 'in' ? 1.25 : 1 / 1.25))); 
      fit(); 
    };
  });
  pv.querySelectorAll('.area').forEach(g => {
    const a = S.areas.find(x => x.id === g.dataset.id), tip = $('ptip');
    const show = () => { tip.textContent = a.area_code + ' · ' + a.area_name; tip.classList.remove('hidden'); g.firstElementChild.setAttribute('fill', 'rgba(37,99,235,.10)'); };
    const hide = () => { tip.classList.add('hidden'); g.firstElementChild.setAttribute('fill', a.id === S.sel ? 'rgba(37,99,235,.22)' : 'rgba(15,23,42,.02)'); };
    g.onmouseenter = g.onfocus = show; g.onmouseleave = g.onblur = hide; g.onpointerdown = e => e.stopPropagation();
    const act = () => draw ? loadForm(a) : select(a.id === S.sel ? null : a.id);
    g.onclick = act; g.onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); act(); } };
  });
  const frac = e => { const r = $('pbox').getBoundingClientRect(); return { x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) }; };
  let st = null;
  pv.onpointerdown = e => { pv.setPointerCapture(e.pointerId); st = draw ? {p0: frac(e), p1: frac(e)} : {sx: e.clientX, sy: e.clientY, ox: S.pan.x, oy: S.pan.y}; };
  pv.onpointermove = e => { if(!st) return; if(draw){ st.p1 = frac(e); drawDraft(rectOf(st)); } else { S.pan = {x: st.ox + e.clientX - st.sx, y: st.oy + e.clientY - st.sy}; fit(); } };
  pv.onpointerup = () => { if(st && draw){ const r = rectOf(st); if(r.w > .005 && r.h > .005) setRect(r); } st = null; };
}

const rectOf = s => ({x: Math.min(s.p0.x, s.p1.x), y: Math.min(s.p0.y, s.p1.y), w: Math.abs(s.p1.x - s.p0.x), h: Math.abs(s.p1.y - s.p0.y)});

const FIELDS = ['area_code', 'area_name', 'building', 'department', 'length_m', 'width_m', 'description', 'notes', 'x', 'y', 'w', 'h'];

function loadForm(a){ 
  S.editId = a.id; S.sel = a.id; S.form = {};

function setRect(r){

}

}

function bindManage(){
  bindPlan(true);
  $('chfl').onclick = () => { S.mFloor = null; S.viewPlan = null; S.editId = null; S.form = {}; S.sel = null; render(); };
  const live = () => { 
    const v = formVals(), l = parseFloat(v.length_m), w = parseFloat(v.width_m); 
    $('calc').textContent = l > 0 && w > 0 ? 'Area: ' + f2(l*w) + ' m²' : '';
    const r = {x: parseFloat(v.x), y: parseFloat(v.y), w: parseFloat(v.w), h: parseFloat(v.h)}; 
    drawDraft(Object.values(r).every(n => !isNaN(n)) ? r : null); 
  };
  FIELDS.forEach(k => $('f_' + k).oninput = live); live();
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => loadForm(S.areas.find(a => a.id === b.dataset.edit)));
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { 
    const a = S.areas.find(x => x.id === b.dataset.del); 
    if(!confirm('Delete ' + a.area_code + ' — ' + a.area_name + '?')) return;
    const {error} = await sb.from('areas').delete().eq('id', a.id); 
    if(error) return toast(error.message); 
    toast('Area deleted'); S.sel = null; S.editId = null; S.form = {}; load(); 
  });
  if($('cancel')) $('cancel').onclick = () => { S.editId = null; S.form = {}; render(); };
  $('save').onclick = async () => {
    const v = formVals(), e = [], code = v.area_code.trim(), n = k => v[k] === '' ? NaN : Number(v[k]);
    if(!S.plan) e.push('Floor ' + S.mFloor + ' has no floor plan yet. Upload and activate one in Settings.');
    if(!code) e.push('Area code is required.'); if(!v.area_name.trim()) e.push('Area name is required.');
    if(!(n('length_m') > 0)) e.push('Length must be greater than zero.'); if(!(n('width_m') > 0)) e.push('Width must be greater than zero.');
    const r = {x: n('x'), y: n('y'), w: n('w'), h: n('h')};
    if(Object.values(r).some(isNaN)) e.push('Draw a rectangle or fill coordinates.');
    const ul = $('errs'); ul.innerHTML = e.map(x => '<li>' + esc(x) + '</li>').join(''); ul.classList.toggle('hidden', !e.length); if(e.length) return;
    const row = { floor_plan_id: S.plan.id, area_code: code, area_name: v.area_name.trim(), building: v.building || null, department: v.department || null, length_m: n('length_m'), width_m: n('width_m'), description: v.description || null, notes: v.notes || null, x: +r.x.toFixed(6), y: +r.y.toFixed(6), w: +r.w.toFixed(6), h: +r.h.toFixed(6) };

    if(error){ $('save').disabled = false; ul.innerHTML = '<li>' + esc(error.message) + '</li>'; ul.classList.remove('hidden'); return; }
    toast(S.editId ? 'Area updated' : 'Area created'); S.editId = null; S.form = {}; load();
  };
}

function bindSettings(){
  let file = null; 
  $('pfile').onchange = e => { 
    file = e.target.files[0] || null; const im = $('pprev'); 
    if(im.dataset.obj) URL.revokeObjectURL(im.dataset.obj);
    if(file){ const u = URL.createObjectURL(file); im.dataset.obj = u; im.src = u; im.classList.remove('hidden'); } else im.classList.add('hidden'); 
  };
  $('pup').onclick = async () => {
    const name = $('pname').value.trim(), floor = Number($('pfloor').value); 
    if(!file || !name) return toast('Please enter a name and select an image file.');
    if(!FLOORS.includes(floor)) return toast('Please choose a floor.');
    $('pup').disabled = true;
    const dim = await new Promise(r => { const i = new Image(); i.onload = () => r({w: i.naturalWidth, h: i.naturalHeight}); i.src = $('pprev').src; });
    const path = crypto.randomUUID() + '-' + file.name.replace(/[^\w.-]/g, '_'), up = await sb.storage.from('floor-plans').upload(path, file);
    if(up.error){ $('pup').disabled = false; return toast(up.error.message); }

const rRows = () => R.areas.filter(a => rInScope(a) && (!R.dept || a.department === R.dept))
  .sort((x, y) => (x.floor - y.floor) || String(x.area_code).localeCompare(String(y.area_code), undefined, {numeric: true}));
const rDepts = () => [...new Set(R.areas.filter(rInScope).map(a => a.department).filter(Boolean))].sort((a, b) => a.localeCompare(b));
const rSum = rows => rows.reduce((s, a) => s + Number(a.area_sqm || 0), 0);
const rScope = () => R.floor === 'all' ? 'All floors' : 'Floor ' + R.floor;
const rGroup = (rows, fn) => { const m = new Map(); rows.forEach(a => { const k = fn(a); if(!m.has(k)) m.set(k, []); m.get(k).push(a); }); return m; };
const rDate = () => new Date().toLocaleDateString('en-GB', {day: '2-digit', month: 'long', year: 'numeric'});
const rStamp = () => new Date().toLocaleDateString('en-CA');
const rFile = ext => ['area-report', R.floor === 'all' ? 'all-floors' : 'floor-' + R.floor, R.dept ? R.dept.replace(/[^\w-]+/g, '_') : null, rStamp()].filter(Boolean).join('_') + '.' + ext;
const rMissing = () => FLOORS.filter(n => (R.floor === 'all' || R.floor === n) && !R.plans.some(p => p.floor === n));

const RCOLS = [
  ['Floor', a => a.floor], ['Area Code', a => a.area_code], ['Area Name', a => a.area_name], ['Building', a => a.building || ''], ['Department', a => a.department || ''],

];

function saveBlob(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// quote cells; neutralise text that spreadsheets would treat as a formula
const csvCell = v => {
  let s = v == null ? '' : String(v);
  if(typeof v === 'string' && /^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};

function exportCsv(){
  const rows = rRows(); if(!rows.length) return;
  const lines = [RCOLS.map(c => csvCell(c[0])).join(','), ...rows.map(a => RCOLS.map(c => csvCell(c[2] === 'n' ? f2(c[1](a)) : c[1](a))).join(','))];
  saveBlob(new Blob(['﻿' + lines.join('\r\n')], {type: 'text/csv;charset=utf-8'}), rFile('csv'));
  toast('CSV exported (' + rows.length + ' areas).');
}

function exportXlsx(){
  if(!window.XLSX) return toast('Excel library failed to load. Reload the page and try again.');
  const rows = rRows(); if(!rows.length) return;
  const n = rows.length, tot = rSum(rows);
  const ws = XLSX.utils.aoa_to_sheet([RCOLS.map(c => c[0]), ...rows.map(a => RCOLS.map(c => c[1](a)))]);
  rows.forEach((_, i) => ['F', 'G', 'H'].forEach(col => { const c = ws[col + (i + 2)]; if(c) c.z = '0.00'; }));
  ws['G' + (n + 2)] = {t: 's', v: 'TOTAL'};
  ws['H' + (n + 2)] = {t: 'n', v: tot, f: 'SUM(H2:H' + (n + 1) + ')', z: '0.00'};
  ws['!ref'] = 'A1:K' + (n + 2);
  ws['!autofilter'] = {ref: 'A1:K' + (n + 1)};
  ws['!cols'] = [6, 12, 28, 16, 18, 12, 12, 12, 32, 32, 14].map(w => ({wch: w}));
  const grp = map => [...map].sort((a, b) => String(a[0]).localeCompare(String(b[0]), undefined, {numeric: true})).map(([k, v]) => [k, v.length, +rSum(v).toFixed(2)]);
  const sum = XLSX.utils.aoa_to_sheet([
    ['Area Dimension Report'], ['Report date', rDate()], ['Scope', rScope()], ['Department', R.dept || 'All departments'], ['Total areas', n], ['Total area (m²)', +tot.toFixed(2)], [],
    ['By floor'], ['Floor', 'Areas', 'Total area (m²)'], ...grp(rGroup(rows, a => 'Floor ' + a.floor)), [],
    ['By department'], ['Department', 'Areas', 'Total area (m²)'], ...grp(rGroup(rows, a => a.department || 'Unassigned'))
  ]);
  sum['!cols'] = [{wch: 28}, {wch: 14}, {wch: 18}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Areas'); XLSX.utils.book_append_sheet(wb, sum, 'Summary');
  XLSX.writeFile(wb, rFile('xlsx'));
  toast('Excel exported (' + n + ' areas).');
}

// floor plan image with the area rectangles drawn on top (areas of the chosen department highlighted)
async function layoutCanvas(plan, areas, o){
  o = o || {};
  const showLabels = o.labels !== false, dept = o.dept || '', maxW = o.max || 1800;
  const { data: blob, error } = await sb.storage.from('floor-plans').download(plan.storage_path);
  if(error || !blob) throw new Error(error?.message || 'Could not download the floor plan image');
  const url = URL.createObjectURL(blob);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('Floor plan image could not be read')); i.src = url; });
    const k = Math.min(1, maxW / img.naturalWidth), W = Math.round(img.naturalWidth * k), H = Math.round(img.naturalHeight * k);
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.drawImage(img, 0, 0, W, H);
    const lw = Math.max(2, W / 600);
    g.lineJoin = 'round'; g.textAlign = 'center'; g.textBaseline = 'middle';
    for(const a of areas){
      const x = a.x * W, y = a.y * H, w = a.w * W, h = a.h * H, on = !dept || a.department === dept;
      if(on){ g.fillStyle = 'rgba(37,99,235,.18)'; g.fillRect(x, y, w, h); }
      g.lineWidth = on ? lw : lw / 2; g.strokeStyle = on ? '#2563eb' : 'rgba(100,116,139,.55)'; g.strokeRect(x, y, w, h);
      const fs = Math.min(h * .4, w / Math.max(String(a.area_code).length, 1) * 1.6);
      if(showLabels && on && fs >= 6){
        g.font = '600 ' + fs + 'px Helvetica, Arial, sans-serif';
        g.lineWidth = fs / 6; g.strokeStyle = '#fff'; g.strokeText(String(a.area_code), x + w / 2, y + h / 2);
        g.fillStyle = '#1e3a8a'; g.fillText(String(a.area_code), x + w / 2, y + h / 2);
      }
    }
    return c;
  } finally { URL.revokeObjectURL(url); }
}

async function rLayoutImage(plan, areas){
  const c = await layoutCanvas(plan, areas, {max: 1800, labels: true, dept: R.dept});
  return { data: c.toDataURL('image/jpeg', .85), w: c.width, h: c.height };
}

async function downloadLayout(){

async function exportPdf(){
  const J = window.jspdf && window.jspdf.jsPDF;
  if(!J) return toast('PDF library failed to load. Reload the page and try again.');
  const rows = rRows(); if(!rows.length || R.busy) return;
  R.busy = true; render();
  try {
    const doc = new J({unit: 'mm', format: 'a4'}), M = 14, PW = 210, tot = rSum(rows);
    const NAVY = [15, 31, 61], dept = R.dept || 'All departments';
    const title = (t, y) => { doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(15, 23, 42); doc.text(t, M, y); };
    const R_ = c => ({content: c, styles: {halign: 'right'}});

    // ---- page 1: summary
    try { doc.addImage(LOGO.dark, 'PNG', PW - M - 36, 9, 36, 36 * 331 / 820); } catch(e) {}
    doc.setFont('helvetica', 'bold'); doc.setFontSize(20); doc.setTextColor(15, 23, 42); doc.text('Area Dimension Report', M, 22);
    doc.setDrawColor(37, 99, 235); doc.setLineWidth(.8); doc.line(M, 26, PW - M, 26);
    doc.autoTable({
      startY: 31, theme: 'plain', styles: {fontSize: 10, cellPadding: 1.6}, margin: {left: M, right: M},
      columnStyles: {0: {fontStyle: 'bold', cellWidth: 45}},
      body: [['Report date', rDate()], ['Scope', rScope()], ['Department filter', dept], ['Total areas', String(rows.length)], ['Total area', f2(tot) + ' m²']]
    });
    let y = doc.lastAutoTable.finalY + 9;
    title('Summary by floor', y);
    doc.autoTable({
      startY: y + 3, theme: 'grid', styles: {fontSize: 9, cellPadding: 2}, headStyles: {fillColor: NAVY}, margin: {left: M, right: M},
      head: [['Floor', 'Active floor plan', R_('Areas'), R_('Total area (m²)')]],
      body: [...rGroup(rows, a => a.floor)].map(([f, v]) => ['Floor ' + f, (R.plans.find(p => p.floor === f) || {}).name || '-', R_(String(v.length)), R_(f2(rSum(v)))]),
      foot: [[{content: 'TOTAL', colSpan: 2}, R_(String(rows.length)), R_(f2(tot))]], showFoot: 'lastPage',
      footStyles: {fillColor: [226, 232, 240], textColor: 20, fontStyle: 'bold'}
    });
    if(!R.dept){
      y = doc.lastAutoTable.finalY + 9;
      title('Summary by department', y);
      doc.autoTable({
        startY: y + 3, theme: 'grid', styles: {fontSize: 9, cellPadding: 2}, headStyles: {fillColor: NAVY}, margin: {left: M, right: M},
        head: [['Department', R_('Areas'), R_('Total area (m²)')]],
        body: [...rGroup(rows, a => a.department || 'Unassigned')].sort((a, b) => a[0].localeCompare(b[0])).map(([d, v]) => [d, R_(String(v.length)), R_(f2(rSum(v)))])
      });
    }

    // ---- one section per floor: layout image + dimension table + total
    const floors = FLOORS.filter(f => rInScope({floor: f}) && R.plans.some(p => p.floor === f) && (!R.dept || rows.some(a => a.floor === f)));
    for(const f of floors){
      const plan = R.plans.find(p => p.floor === f), fr = rows.filter(a => a.floor === f);
      doc.addPage();
      doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(15, 23, 42); doc.text('Floor ' + f + ' - ' + plan.name, M, 18);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(90);
      doc.text('Department: ' + dept + '   |   Areas: ' + fr.length + '   |   Total area: ' + f2(rSum(fr)) + ' m²   |   Report date: ' + rDate(), M, 24);
      let top = 29;
      try {
        const im = await rLayoutImage(plan, R.areas.filter(a => a.floor === f));
        const s = Math.min((PW - 2 * M) / im.w, 118 / im.h), w = im.w * s, h = im.h * s;
        doc.addImage(im.data, 'JPEG', M, top, w, h);
        doc.setDrawColor(203, 213, 225); doc.setLineWidth(.3); doc.rect(M, top, w, h);
        top += h + 4;
        if(R.dept){ doc.setFontSize(8); doc.text('Highlighted: department "' + R.dept + '". Other areas are shown as grey outlines.', M, top); top += 4; }
      } catch(err) {
        doc.setFontSize(9); doc.setTextColor(185, 28, 28); doc.text('Layout image unavailable: ' + err.message, M, top + 4); doc.setTextColor(90); top += 10;
      }
      doc.autoTable({
        startY: top + 3, theme: 'grid', styles: {fontSize: 8.5, cellPadding: 1.8}, headStyles: {fillColor: NAVY}, margin: {left: M, right: M},
        footStyles: {fillColor: [226, 232, 240], textColor: 20, fontStyle: 'bold'}, showFoot: 'lastPage',
        head: [['Code', 'Name', 'Building', 'Department', R_('Length (m)'), R_('Width (m)'), R_('Area (m²)')]],
        body: fr.map(a => [String(a.area_code), String(a.area_name), a.building || '-', a.department || '-', R_(f2(a.length_m)), R_(f2(a.width_m)), R_(f2(a.area_sqm))]),
        foot: [[{content: 'TOTAL', colSpan: 6, styles: {halign: 'right'}}, R_(f2(rSum(fr)))]]
      });
    }

    // ---- footer on every page
    const pages = doc.getNumberOfPages();
    for(let i = 1; i <= pages; i++){
      doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(120);
      doc.text('Area Dimension Monitoring System - ' + rDate(), M, 289);
      doc.text('Page ' + i + ' of ' + pages, PW - M, 289, {align: 'right'});
    }
    doc.save(rFile('pdf'));
    toast('PDF report downloaded.');
  } catch(err) {
    toast('PDF failed: ' + err.message);
  } finally {
    R.busy = false; if(S.page === 'reports') render();
  }
}

function bindLogin(){
  const go = async () => { 
    const emailEl = $('em'), passEl = $('pw');
    if (!emailEl || !passEl) return;
    const c = {email: emailEl.value, password: passEl.value}; 
    $('li').disabled = true;
    const r = await sb.auth.signInWithPassword(c); 
    $('li').disabled = false;
    $('lm').textContent = r.error?.message || ''; 
  };
  $('li').onclick = go; 
  $('pw').onkeydown = e => { if(e.key === 'Enter') go(); };
  $('em').onkeydown = e => { if(e.key === 'Enter') go(); };
}

function render(){
  const app = $('app');
  if(SUPABASE_URL.includes('YOUR-PROJECT')){ app.innerHTML = '<p class="p-8 text-red-600">Please configure SUPABASE_URL and SUPABASE_ANON_KEY in config.js.</p>'; return; }
  if(!S.session){ app.innerHTML = loginHTML(); return bindLogin(); }
  const nav = [['dashboard', 'Dashboard', 0], ['plan', 'Interactive Floor Plan', 0], ['directory', 'Area Directory', 0], ['reports', 'Reports & Export', 0], ['manage', 'Manage Areas', 1], ['settings', 'Settings', 1]].filter(n => !n[2] || isAdmin());
  if((S.page === 'manage' || S.page === 'settings') && !isAdmin()) S.page = 'dashboard';
  const body = S.page === 'dashboard' ? dashboardPage() : S.page === 'plan' ? planPage() : S.page === 'directory' ? directoryPage() : S.page === 'reports' ? reportsPage() : S.page === 'manage' ? manageHTML() : settingsHTML();
  
  app.innerHTML = '<div class="flex h-screen flex-col md:flex-row"><nav class="flex shrink-0 gap-1 overflow-x-auto bg-[#0f1f3d] p-2 text-slate-200 md:w-60 md:flex-col md:p-3">' +
    '<div class="flex shrink-0 items-center gap-2 px-2 md:block md:pb-3 md:pt-1"><img src="' + LOGO.white + '" alt="WIK" class="h-6 w-auto md:h-9"><div class="hidden text-xs font-semibold text-slate-300 md:mt-2 md:block">Area Dimension Monitoring</div></div>' +
    nav.map(([k, l]) => '<button data-nav="' + k + '" class="whitespace-nowrap rounded-md px-3 py-2 text-left text-sm ' + (S.page===k?'bg-blue-600 text-white':'hover:bg-white/10') + '">' + l + '</button>').join('') +
    '<button id="out" class="whitespace-nowrap rounded-md px-3 py-2 text-left text-sm hover:bg-white/10 md:mt-auto">Logout</button></nav>' +
    '<main class="min-h-0 flex-1 overflow-auto p-3 md:p-5">' + (S.viewPlan && isAdmin() && S.plan ? '<p class="mb-2 rounded-md bg-amber-50 p-2 text-sm text-amber-800">Reviewing inactive floor plan (Floor ' + esc(S.plan.floor) + ').</p>' : '') + body + '</main></div>';
  
  document.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => { 
    const k = b.dataset.nav; 
    if(k !== 'manage' && k !== 'settings' && S.viewPlan) S.viewPlan = null; 
    S.page = k; S.editId = null; S.form = {}; 
    if(k === 'manage' && !S.viewPlan) S.mFloor = null;      // always ask for the floor first
    if(k === 'settings') loadPlans();
    if(k === 'reports') loadReport();
    if(k === 'manage' && !S.mFloor) render();
    else if(k !== 'reports' && want() !== S.ctx) load();
    else render();
  });
  $('out').onclick = () => sb.auth.signOut();
  if(S.page === 'dashboard' || S.page === 'plan'){ bindFloorTabs(); bindPlanPage(); }
  else if(S.page === 'directory'){ bindFloorTabs(); bindDirectory(); }
  else if(S.page === 'reports') bindReports();
  else if(S.page === 'manage') S.mFloor ? bindManage() : bindFloorPick();
  else bindSettings();
}

init();
</script>
</body>
</html>
